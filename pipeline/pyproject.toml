[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "convergealpha"
version = "0.1.0"
description = "ConvergeAlpha pipeline: ingest -> features -> models -> forecasts -> JSON export."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "requests>=2.32",
  "yfinance>=0.2.60",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  # IANA time zones for zoneinfo on Windows (Linux runners already have them).
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
convergealpha = "convergealpha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/convergealpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# Formulas in docstrings use the spec's notation (σ, ρ, −, ×) on purpose.
# Line length is left to `ruff format`; long strings and URLs stay readable on one line.
ignore = ["RUF001", "RUF002", "RUF003", "E501", "N812", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# Data libraries without usable stubs are treated as untyped (Any); our own code stays strict.
[[tool.mypy.overrides]]
module = ["pandas.*", "yfinance.*", "sklearn.*", "lightgbm.*", "scipy.*", "pyarrow.*"]
ignore_missing_imports = true
