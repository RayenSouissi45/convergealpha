# Weekly dependency updates: minor and patch versions grouped into one pull request per ecosystem,
# major versions one by one (they can break the code; CI tests every pull request).
version: 2
updates:
  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    groups:
      web:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
