# Weekly dependency updates, grouped so they arrive as a few pull requests (CI tests each one).
version: 2
updates:
  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    groups:
      web:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
