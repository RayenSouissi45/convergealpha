name: intraday

# Every 30 minutes during US market hours: risk/event check for BUY/WATCH candidates and holdings
# (prices, SEC live filings, news) and the live estimate of the paper strategies. Labels and the
# trade ledger are only written after the close; this only warns and estimates.
# 13:05-21:05 UTC covers 9:30-16:00 New York in summer (UTC-4) and winter (UTC-5).
# GitHub skips many scheduled runs under load (14 Oct 2026: 3 of 17 ran), so each run also starts
# the next one about 30 minutes later while the US market is open: one scheduled run that does
# start keeps the chain going for the whole session. A newer run cancels an older one (one chain).
on:
  schedule:
    - cron: '5,35 13-20 * * 1-5'
    - cron: '5 21 * * 1-5'
    - cron: '20,50 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intraday
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - name: Get the latest daily site data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml --status success             --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then echo "::notice::No daily run yet"; exit 1; fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name site-data --dir site-data
      - run: python -m convergealpha intraday --out site-data
        env:
          HOLDINGS: ${{ vars.HOLDINGS }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: site-data-intraday
          path: site-data
          retention-days: 2

  deploy:
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      data_artifact: site-data-intraday
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      deployments: write
    secrets: inherit

  # Keep the live estimate going: wait until about 30 minutes after this run started, then start
  # the next run while New York is between 9:00 and 16:10 on a weekday.
  next:
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    steps:
      - name: Start the next live update in about 30 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STARTED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          open=$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          ny = datetime.now(ZoneInfo("America/New_York"))
          m = ny.hour * 60 + ny.minute
          print(1 if ny.weekday() < 5 and 9 * 60 <= m <= 16 * 60 + 10 else 0)
          PY
          )
          if [ "$open" != "1" ]; then echo "US market closed: the chain stops here"; exit 0; fi
          wait=$(( $(date -d "$STARTED" +%s) + 1800 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run intraday.yml --repo "$GITHUB_REPOSITORY" && echo "next live update started"
