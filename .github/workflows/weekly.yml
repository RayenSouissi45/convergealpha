name: weekly

# Saturday: refresh slow data (XBRL bulk), rebuild the point-in-time dataset, retrain the models
# walk-forward, run the validation lab (holdout evaluated once per configuration), publish the
# model bundle for the daily builds, and keep the scheduled workflows alive.
on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - name: Get the model bundle the daily builds use now (for the gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow weekly.yml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          mkdir -p "$RUNNER_TEMP/prev-models"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name models --dir "$RUNNER_TEMP/prev-models" \
              || echo "::warning::could not get the current bundle; the gate checks the new one alone"
          fi
      - name: Refresh XBRL fundamentals (bulk file; only new facts are stored)
        run: python -m convergealpha bootstrap fundamentals --data data --cache "${{ runner.temp }}/cache"
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      # finanzen.net zero only trades on gettex: its official share list (ESMA FIRDS), mapped to
      # tickers with OpenFIGI. Only new ISINs are looked up; a failure never blocks training.
      - name: Refresh the finanzen.net zero list
        run: python -m convergealpha bootstrap brokers --data data --cache "${{ runner.temp }}/cache"
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
      - name: Train and validate
        run: python -u -m convergealpha weekly --data data --models models-out --out site-validation
      # A worse model is not published: the daily builds keep the last bundle that passed.
      - name: Model gate
        id: gate
        continue-on-error: true
        run: python -m convergealpha model-gate --data data --models models-out --previous "$RUNNER_TEMP/prev-models"
      - run: scripts/data-commit.sh data "weekly models + validation (run ${{ github.run_id }})"
      - if: steps.gate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: models
          path: |
            models-out/*.pkl
            models-out/*.json
            models-out/reference.parquet
          retention-days: 90
          if-no-files-found: error
      # Scheduled workflows in public repos are disabled after 60 days without activity.
      - name: Keep the schedules alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in daily.yml intraday.yml weekly.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" || echo "could not enable $wf"
          done
      - name: Mark the run failed when the model gate failed (the daily builds keep the previous bundle)
        if: steps.gate.outcome != 'success'
        run: |
          echo "::error::The new model failed the gate (see data/state/model_gate.json); it was not published."
          exit 1
