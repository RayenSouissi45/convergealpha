name: bootstrap

# One-time history loads into the private data repo (safe to re-run; stored data is never
# overwritten). SEC tasks run in one job, one after another, to stay under SEC's 10 requests/s.
on:
  workflow_dispatch:
    inputs:
      sec:
        description: SEC company data, insider data sets, XBRL fundamentals
        type: boolean
        default: true
      finra:
        description: FINRA short interest since 2018
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  sec:
    if: inputs.sec
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reference
            state
            insiders
            fundamentals
            filings
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - name: Company records, filings and insider data sets
        run: python -m convergealpha bootstrap sec --data data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - run: scripts/data-commit.sh data "bootstrap - SEC companies, filings, insider data sets (run ${{ github.run_id }})" reference state insiders filings
      - name: XBRL fundamentals (bulk companyfacts.zip)
        run: python -m convergealpha bootstrap fundamentals --data data --cache "${{ runner.temp }}/cache"
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - run: scripts/data-commit.sh data "bootstrap - XBRL fundamentals (run ${{ github.run_id }})" fundamentals state

  finra:
    if: inputs.finra
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reference
            short_interest
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - run: python -m convergealpha bootstrap finra --data data
      - run: scripts/data-commit.sh data "bootstrap - FINRA short interest (run ${{ github.run_id }})" short_interest
