name: daily

# Mon-Fri after the US close. Fan-out so the whole run stays well under 40 minutes:
#   prepare (universe, SEC, insiders, fundamentals, FRED, FINRA)
#     -> fetch x6 (prices + Yahoo analyst data, one shard each)  +  finnhub (calendar, news)
#       -> build (features, labels, forecasts, site JSON)  -> deploy
# Every job writes different paths in the private data repo, so pushes never conflict.
# 22:30 UTC = 18:30 New York in summer, 17:30 in winter. GitHub may start scheduled runs late.
# 03:15 UTC (Tue-Sat) is a catch-up run: when Yahoo served the day's prices only in part, the
# first run waits (paper trading needs 90% of stocks priced) and this one completes the day; on a
# normal day it is a same-day re-run that adds nothing.
on:
  schedule:
    - cron: '30 22 * * 1-5'
    - cron: '15 3 * * 2-6'
  workflow_dispatch:
    inputs:
      tickers:
        description: Optional comma-separated subset (testing only; nothing is stored)
        default: ''

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

env:
  SHARDS: 6

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reference
            state
            insiders
            fundamentals
            filings
            macro
            short_interest
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - run: python -m convergealpha prepare --data data ${TICKERS:+--tickers "$TICKERS"}
        env:
          TICKERS: ${{ inputs.tickers }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - if: ${{ !inputs.tickers }}
        run: scripts/data-commit.sh data "prepare (run ${{ github.run_id }})" reference state insiders fundamentals filings macro short_interest

  fetch:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reference
            state
            prices
            snapshots
            events
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - run: python -m convergealpha fetch --data data --shard ${{ matrix.shard }} --shards "$SHARDS" ${TICKERS:+--tickers "$TICKERS"}
        env:
          TICKERS: ${{ inputs.tickers }}
          HOLDINGS: ${{ vars.HOLDINGS }}
      - if: ${{ !inputs.tickers }}
        run: scripts/data-commit.sh data "fetch shard ${{ matrix.shard }} (run ${{ github.run_id }})" prices snapshots events state

  finnhub:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reference
            state
            events/finnhub_calendar
            news
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - run: python -m convergealpha finnhub --data data ${TICKERS:+--tickers "$TICKERS"}
        env:
          TICKERS: ${{ inputs.tickers }}
          HOLDINGS: ${{ vars.HOLDINGS }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - if: ${{ !inputs.tickers }}
        run: scripts/data-commit.sh data "finnhub (run ${{ github.run_id }})" events/finnhub_calendar snapshots news state

  build:
    needs: [fetch, finnhub]
    if: ${{ !cancelled() && needs.fetch.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # only to append the day's fingerprints to the ledger-heads branch
      actions: write  # to start an early retraining when the inputs drifted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - name: Get the latest model bundle (weekly job)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow weekly.yml --status success             --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::notice::No trained models yet; the build uses the fallback estimate."
          else
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name models --dir "$RUNNER_TEMP/cache/models"               || echo "::warning::Could not download the model bundle; fallback estimate."
          fi
      - run: python -m convergealpha build --data data --out site-data --cache "$RUNNER_TEMP/cache" ${TICKERS:+--tickers "$TICKERS"}
        env:
          GH_TOKEN: ${{ github.token }}
          TICKERS: ${{ inputs.tickers }}
          HOLDINGS: ${{ vars.HOLDINGS }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DANELFIN_API_KEY: ${{ secrets.DANELFIN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: ${{ !inputs.tickers }}
        run: scripts/data-commit.sh data "build (run ${{ github.run_id }})"
      - name: Retrain early when many model inputs drifted (the weekly job runs again)
        if: ${{ !inputs.tickers }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(jq '(.drift.alerts // []) | length' site-data/health.json)
          trained=$(jq -r '.model_trained_at // empty' site-data/health.json)
          if [ "$n" -ge 3 ] && [ -n "$trained" ] && [ $(( $(date +%s) - $(date -d "$trained" +%s) )) -gt 259200 ]; then
            gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" && echo "::notice::$n model inputs drifted: early retraining started"
          else
            echo "drift alerts: $n; no early retraining"
          fi
      - name: Publish today's fingerprints (public, timestamped by GitHub)
        if: ${{ !inputs.tickers }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-heads.sh site-data/commitment.json
      # The site JSON is public anyway (it is the website). deploy.yml reuses it for code-only
      # redeploys between daily runs.
      - uses: actions/upload-artifact@v7
        with:
          name: site-data
          path: site-data
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      data_artifact: site-data
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      deployments: write
    secrets: inherit
