name: daily

# Mon-Fri after the US close: run the pipeline, then publish the site with the fresh data.
# 22:30 UTC = 18:30 New York in summer, 17:30 in winter. GitHub may start scheduled runs late.
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - name: Run pipeline
        run: python -m convergealpha daily --out site-data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DANELFIN_API_KEY: ${{ secrets.DANELFIN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # deploy.yml also reuses this artifact for code-only redeploys between daily runs.
      - uses: actions/upload-artifact@v7
        with:
          name: site-data
          path: site-data
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: pipeline
    uses: ./.github/workflows/deploy.yml
    with:
      data_artifact: site-data
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      deployments: write
    secrets: inherit
