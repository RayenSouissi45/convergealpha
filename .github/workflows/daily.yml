name: daily

# Mon-Fri after the US close: run the pipeline against the private data repo, store the new
# snapshots there, then publish the site with the fresh data.
# 22:30 UTC = 18:30 New York in summer, 17:30 in winter. GitHub may start scheduled runs late.
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: Optional comma-separated subset (testing only)
        default: ''

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - name: Run pipeline
        run: |
          args=()
          if [ -n "${TICKERS}" ]; then args+=(--tickers "${TICKERS}"); fi
          python -m convergealpha daily --data data --out site-data "${args[@]}"
        env:
          TICKERS: ${{ inputs.tickers }}
          HOLDINGS: ${{ vars.HOLDINGS }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DANELFIN_API_KEY: ${{ secrets.DANELFIN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Store new data in the private data repo
        if: ${{ !inputs.tickers }}
        run: scripts/data-commit.sh data "daily run ${{ github.run_id }}"
      # The site JSON is public anyway (it is the website). deploy.yml reuses it for code-only
      # redeploys between daily runs.
      - uses: actions/upload-artifact@v7
        with:
          name: site-data
          path: site-data
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: pipeline
    uses: ./.github/workflows/deploy.yml
    with:
      data_artifact: site-data
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      deployments: write
    secrets: inherit
