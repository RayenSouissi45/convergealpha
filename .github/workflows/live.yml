name: live

# Live values of the paper strategies (version 1 and 2), every minute while New York trades.
# One run loops for up to 5.5 hours (a GitHub job may last 6) and pushes strategies_live.json as the
# only file of the `live` branch (one commit, replaced each minute, so history does not grow) and of
# a tag per minute (live-20261015-1353, kept 15 minutes: GitHub's raw server serves a branch up to 5
# minutes late, a new name never). The Strategies pages read it every 30 seconds while open.
# GitHub skips many scheduled runs under load (most at the top of the hour), so there is a schedule
# every 20 minutes off the hour, and each intraday run also starts this one when none is running. A
# run that starts while another loops waits for it (one at a time) and then exits: the day is over.
# Nothing here is recorded: the trade ledger is written only after the close by the daily run.
on:
  schedule:
    - cron: '7,27,47 13-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write
      actions: write
    steps:
      - name: Is New York trading today, and not past 16:10?
        id: when
        run: |
          go=$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          ny = datetime.now(ZoneInfo("America/New_York"))
          print(1 if ny.weekday() < 5 and ny.hour * 60 + ny.minute < 16 * 60 + 10 else 0)
          PY
          )
          echo "go=$go" >> "$GITHUB_OUTPUT"
          if [ "$go" != "1" ]; then echo "US market closed: nothing to do"; fi
      - if: steps.when.outputs.go == '1'
        uses: actions/checkout@v7
      - if: steps.when.outputs.go == '1'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - if: steps.when.outputs.go == '1'
        run: pip install ./pipeline
      - name: Get the latest official strategy numbers
        if: steps.when.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then echo "::notice::No daily run yet"; exit 1; fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name site-data --dir site-data
      - name: Prepare the live branch
        if: steps.when.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir live-branch
          cd live-branch
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Live values every minute until the close
        id: loop
        if: steps.when.outputs.go == '1'
        run: python -m convergealpha live-loop --out site-data --publish live-branch --minutes 330
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - name: Start the next run (the trading day is not over)
        if: steps.loop.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live.yml --repo "$GITHUB_REPOSITORY" && echo "next live run started"
